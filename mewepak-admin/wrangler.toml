name = "mewepak-admin"
main = "./worker/index.js"
compatibility_date = "2026-11-17"
upload_source_maps = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"

[previews.vars]
ENVIRONMENT = "preview"

[triggers]
crons = ["*/5 * * * *"]
