<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Packaging Consultation — Mewepak</title><meta name="description" content="Schedule a video call or factory visit with Mewepak packaging specialists."><link rel="stylesheet" href="/assets/original/tailwind.css">

  <header class="wp-block-template-part"></header><main id="tool-main" class="booking-wrap"><section class="booking-shell"><aside class="booking-info"><img src="/assets/images/logo.png" alt="Mewepak"><span class="eyebrow">Free Consultation</span><h1 data-booking-title>Meet with Mewepak</h1><p>Talk through your packaging format, materials, barrier needs, print process, quantity and timeline.</p><div class="booking-meta"><span>◷ 15 or 30 minutes</span><span>◎ Video call or factory visit</span><span>✉ Request recorded after submission</span></div></aside><div class="booking-form"><h2>Choose a time</h2><p class="form-help" data-booking-location>Zoom / Factory Visit</p><form data-booking-form><div class="form-grid"><div class="field"><label for="booking-date">Date</label><input id="booking-date" name="date" type="date" required></div><div class="field"><label for="booking-timezone">Your time zone</label><select id="booking-timezone" name="timezone" required><option value="">Loading…</option></select></div><div class="field field-full"><label>Available time</label><div class="slot-grid" data-slot-grid><button class="slot" type="button" disabled>Select a date first</button></div><input type="hidden" name="time" required></div><div class="field field-full"><label>Meeting duration</label><div class="choice-row" data-duration-options><label class="choice"><input type="radio" name="duration" value="15" checked><span>15 minutes</span></label><label class="choice"><input type="radio" name="duration" value="30"><span>30 minutes</span></label></div></div><div class="field field-full"><label>Meeting type</label><div class="choice-row"><label class="choice"><input type="radio" name="meeting_type" value="video_call" checked><span>Video Call</span></label><label class="choice"><input type="radio" name="meeting_type" value="factory_visit"><span>Factory Visit</span></label></div></div><div class="field"><label for="booking-name">Name</label><input id="booking-name" name="name" autocomplete="name" required minlength="2"></div><div class="field"><label for="booking-company">Company</label><input id="booking-company" name="company" autocomplete="organization"></div><div class="field"><label for="booking-email">Email</label><input id="booking-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="booking-phone">Phone</label><input id="booking-phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field field-full"><label for="booking-topic">What would you like to discuss?</label><textarea id="booking-topic" name="topic" maxlength="2000" placeholder="Product type, pouch format, material, estimated quantity or timeline"></textarea></div><div class="field field-full"><div data-turnstile></div><button class="button button-primary" type="submit">Book Consultation</button><div class="form-status" data-form-status role="status"></div></div></div></form></div></section></main><footer class="wp-block-template-part"></footer>
